name: Kaggle Ngrok VIP
version: 1.0.0

models:
  # Bộ não chính - Chuyên xử lý logic và Agent
  - name: Kaggle Qwen 32B (Agent)
    provider: ollama
    model: qwen2.5-coder:32b
    apiBase: https://compellingly-unsainted-mable.ngrok-free.dev 
    roles:
      - chat
      - edit
      - apply

  # Con mắt phụ - Chuyên dùng khi ông giáo cần ném ảnh vào
  - name: Kaggle Llama Vision (Image)
    provider: ollama
    model: llama3.2-vision
    apiBase: https://compellingly-unsainted-mable.ngrok-free.dev 

# Thợ gõ code siêu tốc (vẫn giữ con 3B cho nó nhả token Autocomplete nhanh)
tabAutocompleteModel:
  title: Kaggle Starcoder (Auto)
  provider: ollama
  model: starcoder2:3b
  apiBase: https://compellingly-unsainted-mable.ngrok-free.dev 

context:
  - provider: codebase
    params:
      nRetrieve: 20
  - provider: file
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: tree
  - provider: open
  - provider: clipboard

systemMessage: "Bạn là một AI Software Engineer Senior. Trả lời bằng Tiếng Việt ngắn gọn, suy luận logic và đưa ra code tối ưu nhất."